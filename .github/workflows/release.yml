name: Release

# Either:
#   - push a tag like v1.2.0, or
#   - publish a release with a new v1.2.0 tag from the GitHub website.
# The workflow builds bb-product-search.zip and attaches it to that release.
# Sites running the plugin then see the update in wp-admin.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' bb-product-search.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          CONST=$(grep -m1 -E 'const VERSION' bb-product-search.php | sed -E "s/.*'([^']+)'.*/\1/")
          echo "tag=$TAG header=$HEADER const=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag v$TAG must match the plugin header Version ($HEADER) and VERSION constant ($CONST)."
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: |
          mkdir -p build/bb-product-search
          git archive HEAD | tar -x -C build/bb-product-search
          cd build && zip -rq ../bb-product-search.zip bb-product-search
          unzip -l ../bb-product-search.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release already exists (created on the website): attach/replace the zip.
            gh release upload "$GITHUB_REF_NAME" bb-product-search.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" bb-product-search.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
