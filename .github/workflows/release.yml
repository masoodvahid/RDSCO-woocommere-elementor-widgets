name: Release

# Either:
#   - publish a release with a new tag (e.g. v1.1.0) on the GitHub website, or
#   - push a tag: git tag v1.1.0 && git push origin v1.1.0
# The workflow builds rdsco-woocommerce-elementor-widgets.zip and attaches it to
# that release. Sites running the plugin then see the update in wp-admin.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SLUG: rdsco-woocommerce-elementor-widgets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' "$SLUG.php" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "'RDSCO_WEW_VERSION'" "$SLUG.php" | sed -E "s/.*'RDSCO_WEW_VERSION',[[:space:]]*'([^']+)'.*/\1/")
          echo "tag=$TAG header=$HEADER const=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag v$TAG must match the plugin header Version ($HEADER) and RDSCO_WEW_VERSION ($CONST)."
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: |
          mkdir -p "build/$SLUG"
          git archive HEAD | tar -x -C "build/$SLUG"
          cd build && zip -rq "../$SLUG.zip" "$SLUG"
          unzip -l "../$SLUG.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release already exists (created on the website): attach/replace the zip.
            gh release upload "$GITHUB_REF_NAME" "$SLUG.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$SLUG.zip" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
